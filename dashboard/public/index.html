<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi board</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --card-head: #1c2128;
    --border: #30363d; --border-bright: #3d444d;
    --text: #e6edf3; --muted: #7d8590;
    --accent: #58a6ff; --accent-dim: #1f6feb;
    --green: #3fb950; --amber: #d29922; --pink: #db61a2; --red: #f85149;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --lh: 20px;
    /* One number the rail, the canvas and the composer all agree on. */
    --rail: 252px;
  }
  body.rail-off { --rail: 0px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  /* Thin dark scrollbars, so the rail and a long card look like part of the board. */
  * { scrollbar-width: thin; scrollbar-color: #30363d transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #21262d; border: 3px solid transparent;
    background-clip: content-box; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #3d444d; background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body { font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }

  #viewport {
    position: fixed; inset: 44px 0 96px var(--rail); overflow: hidden;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, #21262d 1px, transparent 0);
    background-size: 24px 24px;
    cursor: grab;
  }
  #viewport.dragging { cursor: grabbing; }
  /* Zoom is a real layout zoom, not a scaled bitmap: text is laid out at the size it is
     shown at, so it stays sharp instead of waiting for a repaint to catch up. */
  #world { position: absolute; top: 0; left: 0; zoom: 1; }

  .card {
    position: absolute; display: flex; flex-direction: column; overflow: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(1, 4, 9, .5); min-width: 220px; min-height: 120px;
  }
  .card.active { border-color: var(--accent-dim); box-shadow: 0 12px 32px rgba(31, 111, 235, .25); }
  /* An answered question grows to hold its reply, up to a readable limit. */
  .card.auto-height { height: auto !important; min-height: 160px; max-height: 760px; }
  .card.fresh { border-color: var(--accent); animation: freshPulse 1.8s ease-in-out 2; }
  @keyframes freshPulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(1, 4, 9, .5); }
    50% { box-shadow: 0 8px 32px rgba(88, 166, 255, .45); }
  }
  .new-badge {
    font: 11px var(--mono); text-transform: uppercase; letter-spacing: .5px;
    color: #0d1117; background: var(--accent); border-radius: 999px; padding: 1px 6px;
  }
  .head {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex: none;
    background: var(--card-head); border-bottom: 1px solid var(--border);
    cursor: grab; user-select: none;
  }
  .card.dragging .head { cursor: grabbing; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .dot.note { background: var(--amber); }
  .dot.question { background: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.18); }
  .title { font-weight: 600; font-size: 13px; letter-spacing: .2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
  .sub { color: var(--muted); font: 12px var(--mono); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  #stop { color: #f85149; border-color: rgba(248,81,73,.4); }
  #stop[disabled] { color: var(--muted); border-color: #30363d; }
  .sticky-status.stopped { color: #f85149; }
  .chip { font: 12px var(--mono); color: var(--accent); background: rgba(88,166,255,.1);
    border: 1px solid rgba(88,166,255,.25); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .chip.queue-pos { color: #d29922; background: rgba(210,153,34,.12); border-color: rgba(210,153,34,.35); }
  .close { border: 0; background: transparent; color: var(--muted); font-size: 16px;
    line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .close:hover { background: #21262d; color: var(--text); }
  .reply { border: 0; background: transparent; color: var(--muted); font: 13px/1 system-ui;
    cursor: pointer; padding: 3px 5px; border-radius: 4px; }
  .reply:hover { background: #21262d; color: var(--accent); }
  .min { border: 0; background: transparent; color: var(--muted); font: 12px/1 system-ui;
    cursor: pointer; padding: 3px 5px; border-radius: 4px; }
  .min:hover { background: #21262d; color: var(--text); }
  /* Folded: the head is the whole card, and the real height stays saved for restoring. */
  .card.mini { height: auto !important; min-height: 0; }
  .card.mini .body, .card.mini .thread, .card.mini .resize { display: none; }
  .card.mini .head { border-bottom: none; }
  .card.replying { border-color: #d29922; box-shadow: 0 0 0 1px rgba(210,153,34,.45), 0 12px 32px rgba(1,4,9,.5); }

  /* Follow-ups live under the card body, in the order they were asked. */
  .thread { flex: none; max-height: 62%; overflow: auto; border-top: 1px solid var(--border);
    background: #0f141b; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .thread[hidden] { display: none; }
  .turn { display: flex; flex-direction: column; gap: 5px; }
  .turn + .turn { border-top: 1px dashed #21262d; padding-top: 8px; }
  .turn-q { color: #f0e6d2; background: #2a2415; border-left: 3px solid #d29922;
    padding: 6px 9px; border-radius: 4px; white-space: pre-wrap; font-size: 12.5px; }
  .turn-status { font: 10px var(--mono); color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; }
  .turn-status.answered { color: var(--green); }
  .turn-status.stopped { color: #f85149; }
  .turn-status.sent { color: var(--accent); }
  .turn-a { padding: 0; color: #c9d1d9; font-size: 12.5px; }

  /* Markdown tables: a wide one scrolls sideways instead of bursting the card. */
  .table-wrap { overflow-x: auto; margin: 6px 0 10px; }
  .table-wrap table { border-collapse: collapse; font-size: 12.5px; }
  .table-wrap th, .table-wrap td { border: 1px solid #30363d; padding: 4px 9px;
    text-align: left; vertical-align: top; }
  .table-wrap th { background: #161b22; color: #e6edf3; font-weight: 600; white-space: nowrap; }
  .table-wrap tr:nth-child(even) td { background: rgba(22,27,34,.55); }

  .body { flex: 1; overflow: auto; position: relative; }
  .note-body { padding: 10px 12px; color: #c9d1d9; word-wrap: break-word; }
  .note-body h1, .note-body h2, .note-body h3 { font-size: 14px; margin: 8px 0 4px; color: #fff; }
  .note-body p { margin: 0 0 8px; }
  .note-body p:last-child { margin-bottom: 0; }
  .note-body strong { color: #fff; }
  .note-body em { color: #d2a8ff; font-style: normal; }
  .note-body code { font: 13px var(--mono); background: #21262d; padding: 1px 4px; border-radius: 4px; }
  .note-body pre { margin: 8px 0; padding: 8px 10px; background: #0d1117;
    border: 1px solid var(--border); border-radius: 6px; overflow: auto; }
  .note-body pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; white-space: pre; }
  .note-body .svg-wrap { margin: 8px 0; background: #0d1117; border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; }
  .note-body .svg-wrap svg { max-width: 100%; height: auto; display: block; }
  .note-body ul { margin: 0 0 8px; padding-left: 18px; list-style: none; }
  .note-body li { margin: 1px 0; }
  .note-body blockquote, .sticky-reply blockquote { margin: 0 0 8px; padding: 2px 0 2px 10px;
    border-left: 2px solid var(--border-bright); color: var(--muted); }
  .note-body blockquote p, .sticky-reply blockquote p { margin: 0 0 4px; }
  .note-body blockquote p:last-child, .sticky-reply blockquote p:last-child { margin-bottom: 0; }
  .note-body .tick { color: var(--green); cursor: pointer; }
  .card .edit { border: 0; background: transparent; color: var(--muted); font-size: 14px;
    line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .card .edit:hover { background: #21262d; color: var(--text); }
  .note-edit { width: 100%; height: 100%; resize: none; border: 0; outline: none;
    background: #0d1117; color: var(--text); font: 13px/1.55 var(--mono); padding: 10px 12px; }
  .note-body a { color: var(--accent); text-decoration: none; }
  .note-body a.xref, .sticky-reply a.xref { color: #79c0ff; border-bottom: 1px dotted rgba(121,192,255,.6);
    cursor: pointer; }
  .note-body a.xref:hover, .sticky-reply a.xref:hover { color: #a5d6ff; border-bottom-style: solid; }
  /* A referenced card rings once so the eye finds it after the jump. */
  .card.flash { animation: flashRing 1.2s ease-out; }
  @keyframes flashRing {
    0% { box-shadow: 0 0 0 2px rgba(88,166,255,.9), 0 8px 24px rgba(1,4,9,.5); }
    100% { box-shadow: 0 0 0 14px rgba(88,166,255,0), 0 8px 24px rgba(1,4,9,.5); }
  }
  .note-body hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }

  /* virtualized code view */
  .code-scroll { position: absolute; inset: 0; overflow: auto; background: #0f141b; }
  .code-inner { position: relative; min-width: 100%; }
  .row { position: absolute; left: 0; display: flex; font: 13px/var(--lh) var(--mono); white-space: pre; }
  .row .n { flex: none; width: 56px; text-align: right; padding-right: 12px; color: #484f58; user-select: none; }
  .row .t { color: #c9d1d9; padding-right: 24px; }
  .row.hit { background: rgba(88,166,255,.13); box-shadow: inset 2px 0 0 var(--accent); }
  .row.hit .n { color: var(--accent); }
  .k { color: #ff7b72; } .s { color: #a5d6ff; } .c { color: #8b949e; font-style: italic; }
  .f { color: #d2a8ff; } .n2 { color: #79c0ff; }

  /* interactive question card */
  .body.q-body-wrap { overflow: auto; }
  .q-body { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .q-text { color: var(--text); font-size: 14px; }
  .q-options { display: flex; flex-direction: column; gap: 6px; }
  .q-opt {
    text-align: left; font: 13px/1.4 system-ui, sans-serif; color: var(--text);
    background: #1c2128; border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; cursor: pointer;
  }
  .q-opt:hover:not(:disabled) { border-color: var(--accent-dim); background: #1f2631; }
  .q-opt:disabled { cursor: default; opacity: .55; }
  .q-opt.picked { border-color: var(--accent); background: rgba(88,166,255,.12); opacity: 1; }
  .q-free { display: flex; gap: 6px; }
  .q-free input {
    flex: 1; font: 13px system-ui, sans-serif; color: var(--text); background: #0d1117;
    border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; outline: none;
  }
  .q-free input:focus { border-color: var(--accent-dim); }
  .q-done { color: var(--muted); font: 12px var(--mono); }
  .q-done.q-problem { color: var(--red); }

  .resize { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 50%, var(--border-bright) 50%);
    border-bottom-right-radius: 9px; }

  header {
    position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 10;
    display: flex; align-items: center; gap: 14px; padding: 0 14px; font-size: 13px;
    background: rgba(13,17,23,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .live { display: flex; align-items: center; gap: 6px; color: var(--green); }
  header .live b { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    display: inline-block; box-shadow: 0 0 0 3px rgba(63,185,80,.15); }
  header .live.down { color: var(--red); }
  header .live.down b { background: var(--red); box-shadow: 0 0 0 3px rgba(248,81,73,.15); }
  header .hint { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .sess { font: 13px var(--mono); color: var(--text); }
  header .sess b { color: var(--accent); font-weight: 600; }
  header .stat { font: 12px var(--mono); color: var(--muted); background: #161b22;
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
  header .stat:empty { display: none; }
  header .stat em { color: var(--text); font-style: normal; }

  /* activity rail */
  #rail {
    position: fixed; top: 44px; left: 0; bottom: 0; width: var(--rail); z-index: 8;
    background: #0a0f16; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; font: 12px var(--mono); overflow: hidden;
  }
  body.rail-off #rail { display: none; }
  /* A collapsed rail leaves a small tab, so activity is never more than one click away. */
  #railOpen { display: none; position: fixed; top: 52px; left: 0; z-index: 8;
    background: #0a0f16; border: 1px solid var(--border); border-left: none;
    border-radius: 0 6px 6px 0; color: var(--muted); font: 11px var(--mono);
    text-transform: uppercase; letter-spacing: .6px; padding: 8px 6px; cursor: pointer;
    writing-mode: vertical-rl; }
  #railOpen:hover { color: var(--text); }
  #railOpen b { color: var(--accent); }
  body.rail-off #railOpen { display: block; }
  /* Drag handle. Six invisible pixels that turn into a line under the cursor. */
  #railGrip { position: absolute; top: 0; bottom: 0; right: 0; width: 6px;
    cursor: col-resize; background: transparent; z-index: 2; }
  #railGrip:hover, body.rail-resizing #railGrip { background: var(--accent-dim); }
  body.rail-resizing { cursor: col-resize; user-select: none; }
  #rail .rail-head { padding: 8px 12px 4px; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: .6px; display: flex; gap: 6px; align-items: center; }
  #rail .rail-head b { color: var(--accent); font-weight: 600; }
  #railToggle { margin-left: auto; background: none; border: none; color: var(--muted);
    cursor: pointer; font: 12px var(--mono); padding: 0 2px; line-height: 1; }
  #railToggle:hover { color: var(--text); }
  #railNow { padding: 0 8px 6px; display: flex; flex-direction: column; gap: 4px; }
  #railLog { flex: 1; overflow-y: auto; padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  .act { border-radius: 6px; padding: 5px 7px; background: #0f141b; border: 1px solid #1c2128;
    flex: none; }
  .act .top { display: flex; align-items: center; gap: 6px; }
  .act .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--green); }
  .act.running .dot { background: var(--accent); animation: pulseDot 1.1s ease-in-out infinite; }
  .act.error .dot { background: var(--red); }
  .act.error { border-color: rgba(248,81,73,.45); }
  .act .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act .ms { margin-left: auto; color: var(--muted); font-size: 11px; flex: none; }
  .act .target, .act .note { color: #6e7681; font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .act.reply { background: #10161e; border-color: #232a33; }
  .act.reply .note { color: #c9d1d9; white-space: pre-wrap; display: -webkit-box;
    -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  @keyframes pulseDot { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* composer */
  #composer {
    position: fixed; left: var(--rail); right: 0; bottom: 0; z-index: 9; height: 96px;
    display: flex; gap: 10px; padding: 10px 14px; background: rgba(10,15,22,.96);
    border-top: 1px solid var(--border); backdrop-filter: blur(8px);
  }
  #composer .type { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  /* Docked: the same field, living at the bottom of the card it is replying to. */
  #composer.docked {
    position: relative; left: auto; right: auto; bottom: auto; top: auto;
    height: auto; flex: none; padding: 8px 10px; gap: 8px;
    background: #0f141b; border-top: 1px solid var(--border); backdrop-filter: none;
  }
  #composer.docked textarea { min-height: 54px; max-height: 150px; font-size: 13px; }
  /* A narrow card cannot hold the field and the buttons side by side, so they stack: buttons
     on the right of the first row, the chip and the field filling the second. */
  #composer.docked { flex-wrap: wrap; }
  #composer.docked .side { order: 1; flex: 1 1 100%; flex-direction: row;
    justify-content: flex-end; align-items: center; gap: 8px; }
  #composer.docked .type { order: 2; flex: 1 1 100%; }
  #composer.docked .hintline { display: none; }
  .card.replying .resize { display: none; }
  /* Floating above the composer, so attachments never squeeze the textarea. */
  #attachments { position: absolute; bottom: 100%; left: 14px; display: flex; gap: 6px; padding-bottom: 6px; }
  #attachments:empty { display: none; }
  #attachments .shot { position: relative; }
  #attachments .shot img { height: 64px; border-radius: 5px; border: 1px solid var(--border); display: block; }
  #attachments .shot button { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px;
    border-radius: 50%; border: 1px solid var(--border); background: #21262d; color: var(--text);
    font: 10px var(--mono); line-height: 1; cursor: pointer; padding: 0; }
  /* One row, scrolling sideways, so a long list of picks costs one line of the field. */
  #pathChips { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; }
  #pathChips:empty { display: none; }
  #pathChips .chip { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; max-width: 240px;
    font: 11px var(--mono); color: var(--text); background: #161b22;
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 4px 2px 9px; }
  #pathChips .chip.folder { color: var(--accent); border-color: var(--accent-dim); }
  #pathChips .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pathChips .chip button { border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font: 12px var(--mono); line-height: 1; padding: 1px 4px; border-radius: 50%; }
  #pathChips .chip button:hover { background: #21262d; color: var(--text); }
  #composer textarea {
    flex: 1; resize: none; font: 14px/1.45 system-ui, sans-serif; color: var(--text);
    background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  #composer textarea:focus { outline: none; border-color: var(--accent-dim); }
  #composer .side { display: flex; flex-direction: column; gap: 6px; justify-content: space-between; }
  #composer .modes { display: flex; gap: 6px; }
  #composer .modes button { font: 11px var(--mono); color: var(--muted); background: #161b22;
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  #composer .modes button.on { color: #0d1117; background: var(--accent); border-color: var(--accent); }
  #composer #send { font: 12px var(--mono); color: #0d1117; background: var(--green);
    border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  #composer #send:disabled { opacity: .5; cursor: default; }
  #composer .hintline { color: var(--muted); font: 11px var(--mono); }
  /* Which card the next message answers, shown above the box until it is sent or cleared. */
  #replyChip { display: flex; align-items: center; gap: 6px; align-self: flex-start;
    font: 11px var(--mono); color: #e3b341; background: rgba(210,153,34,.12);
    border: 1px solid rgba(210,153,34,.4); border-radius: 999px; padding: 2px 4px 2px 9px;
    max-width: 100%; }
  #replyChip[hidden] { display: none; }
  #replyChipText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #replyChip button { border: 0; background: transparent; color: #e3b341; cursor: pointer;
    font: 12px var(--mono); line-height: 1; padding: 1px 4px; border-radius: 50%; }
  #replyChip button:hover { background: rgba(210,153,34,.25); }

  /* Folder picker: anchored above the composer, sized so a folder fits in one glance. */
  #picker { position: fixed; z-index: 2000; display: flex; flex-direction: column; gap: 6px;
    padding: 8px; background: rgba(13,17,23,.98); border: 1px solid var(--border-bright);
    border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  #picker[hidden] { display: none; }
  #picker .p-row { display: flex; gap: 6px; align-items: center; }
  #picker input[type=text] { flex: 1; min-width: 0; font: 11px var(--mono); color: var(--text);
    background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
  #picker input[type=text]:focus { outline: none; border-color: var(--accent-dim); }
  #picker button { font: 11px var(--mono); color: var(--muted); background: #161b22;
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  #picker button:hover { color: var(--text); border-color: var(--border-bright); }
  #picker button:disabled { opacity: .4; cursor: default; }
  #picker .p-hidden { display: flex; align-items: center; gap: 4px; font: 11px var(--mono);
    color: var(--muted); white-space: nowrap; cursor: pointer; }
  #pickList { max-height: 230px; overflow: auto; border: 1px solid var(--border);
    border-radius: 6px; background: #0d1117; }
  #pickList .p-item { display: flex; align-items: center; gap: 7px; padding: 3px 6px;
    font: 12px var(--mono); color: var(--text); cursor: pointer; }
  #pickList .p-item:hover { background: #161b22; }
  #pickList .p-item.on .p-name { color: var(--green); }
  #pickList .p-item .p-tick { color: var(--muted); font-size: 10px; width: 9px; }
  #pickList .p-item.on .p-tick { color: var(--green); }
  #pickList .p-item .p-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pickList .p-item.dir .p-name { color: var(--accent); }
  #pickList .p-item .p-open { border: 0; background: transparent; color: var(--muted);
    cursor: pointer; font: 13px var(--mono); padding: 0 4px; }
  #pickList .p-item .p-open:hover { color: var(--text); }
  #pickList .p-empty { padding: 12px; color: var(--muted); font: 11px var(--mono); text-align: center; }
  #pickError { font: 11px var(--mono); color: var(--red); padding: 0 2px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #pickError[hidden] { display: none; }
  #pickCount { flex: 1; font: 11px var(--mono); color: var(--muted); }

  /* sticky card */
  .sticky-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .sticky-text { color: #f0e6d2; background: #2a2415; border-left: 3px solid #d29922;
    padding: 8px 10px; border-radius: 4px; white-space: pre-wrap; font-size: 13px; }
  .card.sticky .dot { background: #d29922; }
  .sticky-status { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .sticky-status.sent { color: var(--accent); }
  .sticky-status.answered { color: var(--green); }
  .sticky-reply { border-top: 1px dashed #30363d; padding-top: 8px; color: #c9d1d9; font-size: 13px; }
  header .grow { flex: 1; }
  header button { font: 12px var(--mono); color: var(--muted); background: #161b22;
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  header button:hover { color: var(--text); border-color: var(--border-bright); }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
    font-size: 14px; pointer-events: none; text-align: center; padding: 20px; }
</style>
</head>
<body>
<header>
  <span class="brand" title="ctrl+wheel: zoom · drag background: pan · drag header: move · corner: resize">pi</span>
  <span class="sess" id="sess"></span>
  <span class="live" id="live"><b></b> <span id="liveText">connecting</span></span>
  <span class="grow"></span>
  <span class="stat" id="statModel"></span>
  <span class="stat" id="statTokens"></span>
  <span class="stat" id="statCost"></span>
  <span class="stat" id="statCtx"></span>
  <button id="newPill" style="display:none">0 new</button>
  <button id="stop" style="display:none" title="stop this run (same as escape)">stop</button>
  <button id="tidy">tidy</button>
  <button id="fit">fit all</button>
  <button id="reset">100%</button>
</header>

<aside id="rail">
  <div class="rail-head">activity <b id="railRunning"></b><button id="railToggle" title="hide the activity rail">«</button></div>
  <div id="railNow"></div>
  <div id="railLog"></div>
  <div id="railGrip" title="drag to resize"></div>
</aside>
<button id="railOpen" title="show activity">activity <b id="railOpenCount"></b></button>

<div id="composer">
  <div class="type">
    <div id="replyChip" hidden><span id="replyChipText"></span><button id="replyChipClear" title="ask on the board instead of in this card">×</button></div>
    <div id="pathChips"></div>
    <div id="attachments"></div>
    <textarea id="msg" placeholder="message the agent…  (enter sends, shift+enter for a new line, paste an image or pick files)"></textarea>
  </div>
  <div class="side">
    <div class="modes">
      <button data-mode="queue" class="on">queue</button>
      <button data-mode="steer">steer</button>
      <button id="pickFiles" title="attach files or folders from disk">files</button>
    </div>
    <span class="hintline" id="composerHint"></span>
    <button id="send">send</button>
  </div>
</div>

<div id="viewport">
  <div id="world"></div>
  <div class="empty" id="empty">waiting for the agent to put something on the board…</div>
</div>

<div id="picker" hidden>
  <div class="p-row">
    <button id="pickUp" title="parent folder">↑</button>
    <input id="pickPath" type="text" spellcheck="false" title="type a folder and press enter" />
    <button id="pickHome" title="home folder">home</button>
    <button id="pickCwd" title="session folder">session</button>
    <button id="pickClose" title="close">×</button>
  </div>
  <div class="p-row">
    <input id="pickFilter" type="text" placeholder="filter this folder…" spellcheck="false" />
    <label class="p-hidden"><input type="checkbox" id="pickHidden" /> hidden</label>
  </div>
  <div id="pickError" hidden></div>
  <div id="pickList"></div>
  <div class="p-row">
    <span id="pickCount">nothing picked</span>
    <button id="pickHere" title="pick the folder you are looking at">+ this folder</button>
    <button id="pickDone" title="keep what is picked and close">done</button>
  </div>
</div>

<script src="/board.js"></script>
<script>window.BOARD_START && window.BOARD_START();</script>
</body>
</html>
